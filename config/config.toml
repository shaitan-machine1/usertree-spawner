# Trusted system-wide configuration for usertree-spawner.
# A backend is intentionally not predefined. The administrator must select an
# installed backend explicitly, for example:
# backend = "s6-user"

backend_config_dir = "/etc/usertree-spawner/backends"

# pam_usertree_spawner defaults to a 35-second client-side timeout, leaving a
# small margin after this daemon/backend deadline.
login_readiness_timeout_seconds = 30
graceful_stop_timeout_seconds = 15
forced_stop_timeout_seconds = 5
restart_backoff_minimum_milliseconds = 500
restart_backoff_maximum_seconds = 30

root_eligible = false
logging_verbosity = "info"
